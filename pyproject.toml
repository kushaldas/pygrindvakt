[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "pygrindvakt"
version = "0.5.0"
description = "Python bindings for the grindvakt OAuth 2.0 / OpenID Connect / OpenID Federation library"
requires-python = ">=3.10"
license = "BSD-2-Clause"
readme = "README.md"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Session",
    "Topic :: Security",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
]

[project.urls]
Repository = "https://github.com/kushaldas/pygrindvakt"
Documentation = "https://pygrindvakt.readthedocs.io/en/latest/"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "cryptography",
    "flask",
    "django",
    "fastapi",
    "httpx",
    "mypy>=2.4",
    "ruff==0.16.10",
]
docs = [
    # Sphinx 9.1 needs Python >= 3.12 (what Read the Docs uses); older
    # interpreters fall back to the 8.x line so `uv lock` resolves for the
    # whole requires-python range.
    "sphinx==9.1.0; python_version >= '3.12'",
    "sphinx>=8.0,<9; python_version < '3.12'",
    "furo",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "pygrindvakt._native"

[tool.pytest.ini_options]
markers = [
    "pkcs11: tests requiring a SoftHSM2 token (auto-skip if unavailable)",
    "redis: tests requiring a live Redis at REDIS_URL (auto-skip if unset)",
]
# Warnings are errors, so a new unexpected one fails the run. Tests that provoke a
# warning on purpose use pytest.warns; adapter failures reported through
# sys.unraisablehook (ADR 0002) are captured by the `unraisable` fixture. The Rust
# helper convert::warn is best effort and drops the exception an `error` filter makes
# warnings.warn raise, so tests/conftest.py also records UserWarnings with an
# `always` filter and fails a test that emitted one it did not expect.
# Later entries take precedence over earlier ones.
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "error::UserWarning",
    # Third party: fastapi.testclient imports starlette.testclient, which warns that
    # httpx is deprecated in favour of httpx2 (a UserWarning subclass). Not ours to fix.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]

[tool.ruff]
line-length = 120
extend-exclude = ["docs"]

[tool.ruff.lint]
# `select` (not `extend-select`) so ruff's implicit defaults cannot change the gate.
# F821 must stay enabled for the stubs. Whole families where the repo is clean,
# individual codes (S1xx, TRY) where only part of a family was ever enabled.
select = [
    "ASYNC", "B", "BLE", "C4", "DTZ", "E4", "E7", "E9", "EXE", "F", "FA", "FLY", "G", "I", "INT", "LOG",
    "PERF", "PIE", "PLE", "PYI", "RUF", "S102", "S110", "S112", "SIM", "T10", "TC", "TRY002", "TRY004", "TRY201", "TRY203", "TRY401", "UP", "W6", "YTT",
]

[tool.ruff.lint.per-file-ignores]
# PYI029 autofix deletes `__repr__` from stubs. Several runtime reprs redact
# secrets on purpose, and tests/test_stubs.py requires the stub to declare them.
# PYI021: the stubs carry the user-facing docstrings on purpose.
"*.pyi" = ["PYI029", "PYI021"]
