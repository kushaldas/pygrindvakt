name: ci
on:
  pull_request:
    paths:
      - 'src/**'
      - 'python/**'
      - 'tests/**'
      - 'examples/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'justfile'
      - 'build-wheels.sh'
      - '.github/workflows/**'
      - '.github/scripts/**'
  workflow_dispatch:
env:
  FORCE_COLOR: "1"
  UV_LINK_MODE: "copy"
  UV_VERSION: "0.11.23"
  # Rust compiler for CI and release builds. The manylinux setup script requires it
  # (passed via `docker run -e`); bump it here and in the other workflow.
  RUST_TOOLCHAIN: "1.99.1"
jobs:

  manylinux_x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7

    - name: Pull the manylinux image
      run: docker pull quay.io/pypa/manylinux_2_28_x86_64

    - name: Build the wheel inside manylinux container
      env:
        UV_VERSION: ${{ env.UV_VERSION }}
        RUST_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
      run: |
        docker run --rm \
          -e UV_VERSION="$UV_VERSION" \
          -e RUST_TOOLCHAIN="$RUST_TOOLCHAIN" \
          -e RUSTUP_HOME=/opt/rustup \
          -e CARGO_HOME=/opt/cargo \
          -v "$GITHUB_WORKSPACE":/io \
          quay.io/pypa/manylinux_2_28_x86_64 \
          /bin/bash /io/.github/scripts/setup-manylinux-build-env.sh

    - name: Install UV and test wheel
      run: |
        python3 -m pip install --user "uv==${UV_VERSION}"
        ~/.local/bin/uv venv
        ~/.local/bin/uv pip install pytest cryptography flask django fastapi httpx
        ~/.local/bin/uv pip install ./dist/pygrindvakt-*.whl
        .venv/bin/python -m pytest tests/ -vvv

    - name: Store wheels
      uses: actions/upload-artifact@v7
      with:
        name: pygrindvakt_manylinux_x86_64
        path: dist/
        overwrite: true
        retention-days: 1
        if-no-files-found: "error"
        compression-level: 0

  # PKCS#11 / HSM integration tests, driven by SoftHSM2.
  # Unlike pybergshamra (which provisions a token via hsm-test/setup.sh),
  # pygrindvakt's `softhsm` pytest fixture provisions a throwaway token itself
  # and auto-skips when the tooling is absent, so this job only needs to install
  # softhsm2 + opensc and run the suite; the pkcs11-marked tests then execute.
  hsm:
    name: HSM (SoftHSM2 / PKCS#11) + Redis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379/
    steps:
    - uses: actions/checkout@v7

    - name: Install SoftHSM2 + OpenSC
      run: sudo apt-get update && sudo apt-get install -y softhsm2 opensc

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}

    - name: Install UV
      run: |
        python3 -m pip install --user "uv==${UV_VERSION}"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Build and install the extension
      run: |
        uv venv
        uv pip install "maturin==1.14.1" pytest cryptography flask django fastapi httpx
        .venv/bin/maturin develop --locked

    - name: Run the test suite (incl. PKCS#11 and Redis)
      run: |
        .venv/bin/python -m pytest tests/ -vvv

  # Static typing check of the shipped stubs. No native build is needed: mypy
  # reads python/pygrindvakt/*.pyi directly via MYPYPATH.
  typecheck:
    name: mypy --strict (stubs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7

    - name: Install UV
      run: |
        python3 -m pip install --user "uv==${UV_VERSION}"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Run mypy
      run: |
        uv sync --frozen --only-group dev
        MYPYPATH=python .venv/bin/mypy --strict tests/typecheck_usage.py

  # Lint + format check, same as `just lint` and `just format-check`.
  ruff:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7

    - name: Install UV
      run: |
        python3 -m pip install --user "uv==${UV_VERSION}"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Run ruff
      run: |
        uv sync --frozen --only-group dev
        .venv/bin/ruff check python tests examples
        .venv/bin/ruff format --check python tests examples

